
name: DJTrust Website - Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: djtrust-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1 - BUILD REACT FRONTEND
  # ==========================================

  build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc -b

      - name: Build production frontend
        run: npm run build

      - name: Verify production build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Production index.html missing"
            exit 1
          fi

          echo "Production build verified."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: djtrust-frontend
          path: Frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # JOB 2 - DEPLOY TO CLOUDCONE IIS
  # ==========================================

  deploy:
    name: Deploy to CloudCone IIS
    needs: build

    runs-on: [self-hosted, Windows, X64, iis-deploy]
    timeout-minutes: 30

    steps:

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: djtrust-frontend
          path: ${{ runner.temp }}\djtrust-production-${{ github.run_id }}-${{ github.run_attempt }}

      # ======================================
      # BACKUP AND DEPLOY
      # ======================================

      - name: Backup and deploy Frontend
        shell: powershell

        env:
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

        run: |

          $ErrorActionPreference = "Stop"

          # ==================================
          # CONFIGURATION
          # ==================================

          $source = Join-Path $env:RUNNER_TEMP "djtrust-production-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"

          $destination = "C:\inetpub\wwwroot\DJTrustwebsit\Frontend"

          $backupRoot = "C:\DeploymentBackups\DJTrustWebsite"

          $backupPath = Join-Path $backupRoot "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"


          # ==================================
          # ROBOCOPY HELPER
          # ==================================

          function Invoke-Robocopy {
              param(
                  [string[]]$Arguments,
                  [string]$Operation
              )

              & robocopy @Arguments

              $code = $LASTEXITCODE

              if ($code -ge 8) {
                  throw "$Operation failed. Robocopy exit code: $code"
              }

              Write-Host "$Operation completed. Robocopy exit code: $code"
          }


          # ==================================
          # VALIDATE
          # ==================================

          Write-Host "Checking production build..."

          if (!(Test-Path "$source\index.html")) {
              throw "Production index.html missing"
          }

          if (!(Test-Path $destination -PathType Container)) {
              throw "IIS Frontend directory missing"
          }

          if (!(Test-Path "$destination\index.html")) {
              throw "Existing production index.html missing"
          }

          if (!(Test-Path "$destination\web.config")) {
              throw "Existing IIS web.config missing"
          }


          # ==================================
          # CREATE BACKUP
          # ==================================

          Write-Host "Creating production backup..."

          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null

          New-Item -ItemType Directory -Force -Path $backupPath | Out-Null

          Invoke-Robocopy -Arguments @(
              $destination,
              $backupPath,
              "/E",
              "/R:2",
              "/W:3",
              "/COPY:DAT",
              "/DCOPY:DAT",
              "/XJ",
              "/NP"
          ) -Operation "Backup"

          if (!(Test-Path "$backupPath\index.html") -or
              !(Test-Path "$backupPath\web.config")) {
              throw "Backup verification failed"
          }

          $backupIndexHash = (Get-FileHash "$backupPath\index.html" -Algorithm SHA256).Hash

          $backupConfigHash = (Get-FileHash "$backupPath\web.config" -Algorithm SHA256).Hash

          Write-Host "Backup verified: $backupPath"


          # ==================================
          # DEPLOYMENT
          # ==================================

          try {

              Write-Host "Deploying React frontend..."

              # Do not overwrite or delete IIS web.config.
              # Do not mirror-delete existing uploads or media.

              Invoke-Robocopy -Arguments @(
                  $source,
                  $destination,
                  "/E",
                  "/XF",
                  "web.config",
                  "/R:2",
                  "/W:3",
                  "/COPY:DAT",
                  "/DCOPY:DAT",
                  "/XJ",
                  "/NP"
              ) -Operation "Frontend deployment"


              # ==================================
              # VERIFY DEPLOYMENT
              # ==================================

              Write-Host "Verifying deployment..."

              if (!(Test-Path "$destination\index.html")) {
                  throw "Deployment failed: index.html missing"
              }

              if (!(Test-Path "$destination\web.config")) {
                  throw "Deployment failed: web.config missing"
              }

              $sourceHash = (Get-FileHash "$source\index.html" -Algorithm SHA256).Hash

              $destinationHash = (Get-FileHash "$destination\index.html" -Algorithm SHA256).Hash

              if ($sourceHash -ne $destinationHash) {
                  throw "Deployment failed: index.html hash mismatch"
              }

              $configHashAfter = (Get-FileHash "$destination\web.config" -Algorithm SHA256).Hash

              if ($backupConfigHash -ne $configHashAfter) {
                  throw "IIS web.config was unexpectedly modified"
              }


              # ==================================
              # SUCCESS
              # ==================================

              Write-Host ""
              Write-Host "===================================="
              Write-Host "DJTRUST DEPLOYMENT SUCCESSFUL"
              Write-Host "===================================="

              Write-Host "Commit: $env:GITHUB_COMMIT"
              Write-Host "Destination: $destination"
              Write-Host "Backup: $backupPath"

          }

          catch {

              $deploymentError = $_.Exception.Message

              Write-Warning "Deployment failed: $deploymentError"

              Write-Warning "Starting automatic rollback..."

              # Restore previous website.
              # Exclude web.config from overwrite because it must be preserved.

              Invoke-Robocopy -Arguments @(
                  $backupPath,
                  $destination,
                  "/E",
                  "/PURGE",
                  "/XF",
                  "web.config",
                  "/R:2",
                  "/W:3",
                  "/COPY:DAT",
                  "/DCOPY:DAT",
                  "/XJ",
                  "/NP"
              ) -Operation "Rollback"

              # Verify restored website.

              if (!(Test-Path "$destination\index.html") -or
                  !(Test-Path "$destination\web.config")) {
                  throw "CRITICAL: Rollback verification failed. Backup: $backupPath"
              }

              $restoredIndexHash = (Get-FileHash "$destination\index.html" -Algorithm SHA256).Hash

              $restoredConfigHash = (Get-FileHash "$destination\web.config" -Algorithm SHA256).Hash

              if ($restoredIndexHash -ne $backupIndexHash) {
                  throw "CRITICAL: Restored index.html does not match backup"
              }

              if ($restoredConfigHash -ne $backupConfigHash) {
                  throw "CRITICAL: Restored web.config does not match backup"
              }

              Write-Warning "Previous website successfully restored."

              throw "Deployment failed. Previous website restored. Error: $deploymentError"
          }


      # ======================================
      # CLEANUP
      # ======================================

      - name: Cleanup temporary files
        if: always()
        shell: powershell

        run: |

          $tempPath = Join-Path $env:RUNNER_TEMP "djtrust-production-${{ github.run_id }}-${{ github.run_attempt }}"

          if (Test-Path $tempPath) {

              Remove-Item $tempPath -Recurse -Force

              Write-Host "Temporary files cleaned successfully."

          }