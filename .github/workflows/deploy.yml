
name: DJTrust Website - Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: djtrust-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1 - BUILD REACT FRONTEND
  # ==========================================

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc -b

      - name: Build production frontend
        run: npm run build

      - name: Verify production build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Production index.html missing"
            exit 1
          fi

          echo "Production frontend build verified."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: djtrust-frontend
          path: Frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # JOB 2 - BUILD .NET BACKEND
  # ==========================================

  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Backend/DjTrust.Api.csproj

      - name: Publish .NET Backend
        run: dotnet publish Backend/DjTrust.Api.csproj -c Release -o Backend/publish

      - name: Verify production backend build
        run: |
          if [ ! -f "Backend/publish/DjTrust.Api.dll" ]; then
            echo "::error::Production DjTrust.Api.dll missing"
            exit 1
          fi

          echo "Production backend build verified."

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: djtrust-backend
          path: Backend/publish/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # JOB 3 - DEPLOY TO CLOUDCONE IIS
  # ==========================================

  deploy:
    name: Deploy to CloudCone IIS
    needs: [build-frontend, build-backend]

    runs-on: [self-hosted, Windows, X64, iis-deploy]
    timeout-minutes: 30

    steps:

      # ======================================
      # DOWNLOAD BUILD ARTIFACTS
      # ======================================

      - name: Download Frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: djtrust-frontend
          path: ${{ runner.temp }}\djtrust-frontend-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download Backend artifact
        uses: actions/download-artifact@v4
        with:
          name: djtrust-backend
          path: ${{ runner.temp }}\djtrust-backend-${{ github.run_id }}-${{ github.run_attempt }}

      # ======================================
      # BACKUP AND DEPLOY FRONTEND & BACKEND
      # ======================================

      - name: Deploy Frontend and Backend to IIS
        shell: powershell

        env:
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

        run: |

          $ErrorActionPreference = "Stop"

          # ==================================
          # CONFIGURATION
          # ==================================

          $frontendSource = Join-Path $env:RUNNER_TEMP "djtrust-frontend-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $backendSource  = Join-Path $env:RUNNER_TEMP "djtrust-backend-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"

          $frontendDest = "C:\inetpub\wwwroot\DJTrustwebsit\Frontend"
          $backendDest  = "C:\inetpub\wwwroot\DJTrustwebsit\Backend"

          $backupRoot = "C:\DeploymentBackups\DJTrustWebsite"
          $backupPath = Join-Path $backupRoot "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $frontendBackup = Join-Path $backupPath "Frontend"
          $backendBackup  = Join-Path $backupPath "Backend"

          $appOfflinePath = Join-Path $backendDest "app_offline.htm"

          # ==================================
          # ROBOCOPY HELPER
          # ==================================

          function Invoke-Robocopy {
              param(
                  [string[]]$Arguments,
                  [string]$Operation
              )

              & robocopy @Arguments

              $code = $LASTEXITCODE

              if ($code -ge 8) {
                  throw "$Operation failed. Robocopy exit code: $code"
              }

              # Reset $LASTEXITCODE to 0 since Robocopy codes 0-7 indicate success / non-fatal status
              # (e.g. 1 means files copied successfully, 0 means no files changed).
              $global:LASTEXITCODE = 0

              Write-Host "$Operation completed successfully. Robocopy exit code: $code"
          }


          # ==================================
          # VALIDATE SOURCES & DIRECTORIES
          # ==================================

          Write-Host "Validating production build artifacts..."

          if (!(Test-Path "$frontendSource\index.html")) {
              throw "Frontend artifact missing index.html"
          }

          if (!(Test-Path "$backendSource\DjTrust.Api.dll")) {
              throw "Backend artifact missing DjTrust.Api.dll"
          }

          # Ensure destination directories exist on IIS
          if (!(Test-Path $frontendDest -PathType Container)) {
              New-Item -ItemType Directory -Force -Path $frontendDest | Out-Null
          }

          if (!(Test-Path $backendDest -PathType Container)) {
              New-Item -ItemType Directory -Force -Path $backendDest | Out-Null
          }

          # Prepare backup folders
          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $backupPath | Out-Null
          New-Item -ItemType Directory -Force -Path $frontendBackup | Out-Null
          New-Item -ItemType Directory -Force -Path $backendBackup | Out-Null


          # ==================================
          # 1. FRONTEND BACKUP & DEPLOYMENT
          # ==================================

          try {
              Write-Host ""
              Write-Host "===================================="
              Write-Host "STARTING FRONTEND DEPLOYMENT"
              Write-Host "===================================="

              if (Test-Path "$frontendDest\index.html") {
                  Write-Host "Creating Frontend backup..."
                  Invoke-Robocopy -Arguments @(
                      $frontendDest,
                      $frontendBackup,
                      "/E",
                      "/R:2",
                      "/W:3",
                      "/COPY:DAT",
                      "/DCOPY:DAT",
                      "/XJ",
                      "/NP"
                  ) -Operation "Frontend Backup"

                  Write-Host "Frontend backup verified: $frontendBackup"
              }

              Write-Host "Deploying React frontend..."
              # Preserve IIS web.config. Do not delete existing uploads or media.
              Invoke-Robocopy -Arguments @(
                  $frontendSource,
                  $frontendDest,
                  "/E",
                  "/XF", "web.config",
                  "/R:2",
                  "/W:3",
                  "/COPY:DAT",
                  "/DCOPY:DAT",
                  "/XJ",
                  "/NP"
              ) -Operation "Frontend Deployment"

              Write-Host "Verifying frontend deployment..."
              if (!(Test-Path "$frontendDest\index.html")) {
                  throw "Frontend deployment failed: index.html missing"
              }

              $srcFrontHash = (Get-FileHash "$frontendSource\index.html" -Algorithm SHA256).Hash
              $dstFrontHash = (Get-FileHash "$frontendDest\index.html" -Algorithm SHA256).Hash
              if ($srcFrontHash -ne $dstFrontHash) {
                  throw "Frontend deployment failed: index.html hash mismatch"
              }

              Write-Host "Frontend deployed and verified successfully."
          }
          catch {
              $frontendError = $_.Exception.Message
              Write-Warning "Frontend deployment error: $frontendError"

              if (Test-Path "$frontendBackup\index.html") {
                  Write-Warning "Rolling back Frontend from backup..."
                  Invoke-Robocopy -Arguments @(
                      $frontendBackup,
                      $frontendDest,
                      "/E",
                      "/PURGE",
                      "/XF", "web.config",
                      "/R:2", "/W:3",
                      "/COPY:DAT", "/DCOPY:DAT",
                      "/XJ", "/NP"
                  ) -Operation "Frontend Rollback"
              }

              throw "Frontend deployment failed. Error: $frontendError"
          }


          # ==================================
          # 2. BACKEND BACKUP & DEPLOYMENT
          # ==================================

          try {
              Write-Host ""
              Write-Host "===================================="
              Write-Host "STARTING BACKEND DEPLOYMENT"
              Write-Host "===================================="

              if (Test-Path "$backendDest\DjTrust.Api.dll") {
                  Write-Host "Creating Backend backup..."
                  # Exclude Uploads and logs so customer files and logs are not unnecessarily duplicated
                  Invoke-Robocopy -Arguments @(
                      $backendDest,
                      $backendBackup,
                      "/E",
                      "/XD", "Uploads", "logs",
                      "/R:2",
                      "/W:3",
                      "/COPY:DAT",
                      "/DCOPY:DAT",
                      "/XJ",
                      "/NP"
                  ) -Operation "Backend Backup"

                  Write-Host "Backend backup verified: $backendBackup"
              }

              # Gracefully take backend offline to release DLL file locks in IIS
              Write-Host "Placing app_offline.htm to release IIS DLL locks..."
              Set-Content -Path $appOfflinePath -Value '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="5"><title>Site Updating</title><style>body{font-family:sans-serif;text-align:center;padding:50px;background:#f8fafc;color:#334155;}h2{color:#003d8f;}</style></head><body><h2>D.J. Trust API Maintenance</h2><p>Application update is in progress. Please wait a moment...</p></body></html>'
              Start-Sleep -Seconds 3

              Write-Host "Deploying .NET Backend API..."
              # Preserve Uploads, logs, server environment files (.env, appsettings.Production.json)
              Invoke-Robocopy -Arguments @(
                  $backendSource,
                  $backendDest,
                  "/E",
                  "/XF", "app_offline.htm", "appsettings.Production.json", ".env",
                  "/XD", "Uploads", "logs",
                  "/R:3",
                  "/W:3",
                  "/COPY:DAT",
                  "/DCOPY:DAT",
                  "/XJ",
                  "/NP"
              ) -Operation "Backend Deployment"

              Write-Host "Verifying backend deployment..."
              if (!(Test-Path "$backendDest\DjTrust.Api.dll")) {
                  throw "Backend deployment failed: DjTrust.Api.dll missing"
              }
              if (!(Test-Path "$backendDest\web.config")) {
                  throw "Backend deployment failed: web.config missing"
              }

              $srcDllHash = (Get-FileHash "$backendSource\DjTrust.Api.dll" -Algorithm SHA256).Hash
              $dstDllHash = (Get-FileHash "$backendDest\DjTrust.Api.dll" -Algorithm SHA256).Hash
              if ($srcDllHash -ne $dstDllHash) {
                  throw "Backend deployment failed: DjTrust.Api.dll hash mismatch"
              }

              Write-Host "Backend deployed and verified successfully."
          }
          catch {
              $backendError = $_.Exception.Message
              Write-Warning "Backend deployment error: $backendError"

              if (Test-Path "$backendBackup\DjTrust.Api.dll") {
                  Write-Warning "Rolling back Backend from backup..."
                  Invoke-Robocopy -Arguments @(
                      $backendBackup,
                      $backendDest,
                      "/E",
                      "/XF", "app_offline.htm", "appsettings.Production.json", ".env",
                      "/XD", "Uploads", "logs",
                      "/R:2", "/W:3",
                      "/COPY:DAT", "/DCOPY:DAT",
                      "/XJ", "/NP"
                  ) -Operation "Backend Rollback"
              }

              throw "Backend deployment failed. Error: $backendError"
          }
          finally {
              # ALWAYS ensure app_offline.htm is removed so the site is never left in maintenance mode
              if (Test-Path $appOfflinePath) {
                  Remove-Item $appOfflinePath -Force -ErrorAction SilentlyContinue
                  Write-Host "app_offline.htm removed. Backend is now online."
              }
          }


          # ==================================
          # SUCCESS
          # ==================================

          Write-Host ""
          Write-Host "===================================="
          Write-Host "DJTRUST FULL DEPLOYMENT SUCCESSFUL"
          Write-Host "===================================="
          Write-Host "Commit:          $env:GITHUB_COMMIT"
          Write-Host "Frontend Path:   $frontendDest"
          Write-Host "Backend Path:    $backendDest"
          Write-Host "Backup Path:     $backupPath"

          $global:LASTEXITCODE = 0
          exit 0


      # ======================================
      # CLEANUP TEMPORARY FILES
      # ======================================

      - name: Cleanup temporary files
        if: always()
        shell: powershell

        run: |

          $tempFrontend = Join-Path $env:RUNNER_TEMP "djtrust-frontend-${{ github.run_id }}-${{ github.run_attempt }}"
          $tempBackend  = Join-Path $env:RUNNER_TEMP "djtrust-backend-${{ github.run_id }}-${{ github.run_attempt }}"

          if (Test-Path $tempFrontend) {
              Remove-Item $tempFrontend -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $tempBackend) {
              Remove-Item $tempBackend -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Temporary deployment files cleaned successfully."
